services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockmate}
      POSTGRES_USER: ${POSTGRES_USER:-stockmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - stockmate-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  stockmate-data:
