server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: stockmate-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stockmate}
    username: ${SPRING_DATASOURCE_USERNAME:stockmate}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
stockmate:
  business-zone: Asia/Saigon
  ai:
    enabled: ${AI_ENABLED:false}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:}
  replenishment:
    scheduling-enabled: ${REPLENISHMENT_SCHEDULING_ENABLED:false}
    cron: "0 5 0 * * *"
